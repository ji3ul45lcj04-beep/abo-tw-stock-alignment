name: Scan Taiwan stocks and deploy Pages

on:
  workflow_dispatch:
    inputs:
      deploy_only:
        description: Publish the latest committed docs without rescanning
        required: false
        default: false
        type: boolean
  schedule:
    # Late GitHub-only backups for the external Vercel triggers. GitHub cron is
    # best-effort, so it is no longer the primary scheduler. The freshness gate
    # skips these jobs when Vercel already published the requested window.
    # 23:50/07:50 UTC = 07:50/15:50 Asia/Taipei.
    - cron: "50 23 * * *"
    - cron: "50 7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tw-stock-alignment-pages
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    env:
      TZ: Asia/Taipei

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide whether this backup run is needed
        id: freshness
        env:
          DEPLOY_ONLY: ${{ inputs.deploy_only }}
        run: python should_run.py

      - name: Select weekly cache key
        if: steps.freshness.outputs.scan == 'true'
        shell: bash
        run: echo "CACHE_WEEK=$(date +%G-%V)" >> "$GITHUB_ENV"

      - name: Restore market history cache
        if: steps.freshness.outputs.scan == 'true'
        id: history-cache
        uses: actions/cache@v4
        with:
          path: data/tw_stock_cache
          key: tw-stock-history-${{ env.CACHE_WEEK }}
          restore-keys: |
            tw-stock-history-

      - name: Expand initial history seed
        if: steps.freshness.outputs.scan == 'true' && steps.history-cache.outputs.cache-matched-key == ''
        shell: bash
        run: tar -xzf tw_stock_cache_seed.tar.gz -C data

      - name: Run regression tests
        if: steps.freshness.outputs.scan == 'true'
        run: python -m unittest

      - name: Scan full Taiwan market
        if: steps.freshness.outputs.scan == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            python tw_stock_alignment_scanner.py \
              --markets TWSE,TPEX \
              --years 6 \
              --cache-hours 18 \
              --sleep 0.12 \
              --adx-threshold 30 \
              --ema-length 200 \
              --dmi-length 14 \
              --adx-smoothing 14 \
              --buy-ema-length 20 \
              --stop-lookback 10 \
              --stop-ema-length 50 \
              --stop-atr-length 14 \
              --stop-atr-mult 0.5 \
              --stop-buffer-pct 0 \
              --min-stop-risk-pct 3 \
              --max-stop-risk-pct 15 \
              --far-entry-pct 15 \
              --use-taifex-night \
              --market-contract TX \
              --night-bull-pct 0.3 \
              --night-bear-pct 0.3 \
              --night-neutral-entry-atr 0.2 \
              --night-bear-entry-atr 0.5 \
              --tp-ratio-1 1 \
              --tp-ratio-2 2 \
              --tp-ratio-3 3 \
              --tp-resistance-lookback 120 \
              --tp-min-gap-pct 1 \
              --tp-min-resistance-r 0.8 \
              --tp-min-step-r 0.5 \
              --only-align \
              --no-live-quotes \
              --plan-state data/alignment_plans.json \
              --csv docs/tw_day_week_alignment.csv \
              --html docs/index.html && break
            if [ "$attempt" = "4" ]; then exit 1; fi
            sleep $((attempt * 30))
          done

      - name: Validate generated site
        if: steps.freshness.outputs.scan == 'true'
        run: python validate_output.py

      - name: Preserve latest state and snapshot
        if: steps.freshness.outputs.scan == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alignment_plans.json docs/index.html docs/tw_day_week_alignment.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Taiwan stock alignment snapshot"
            git push
          fi

      - name: Configure GitHub Pages
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Wait for artifact propagation
        if: steps.freshness.outputs.deploy == 'true'
        run: sleep 20

      - name: Deploy GitHub Pages
        if: steps.freshness.outputs.deploy == 'true'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deployment retry
        if: steps.freshness.outputs.deploy == 'true' && steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry GitHub Pages deployment
        if: steps.freshness.outputs.deploy == 'true' && steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4

      - name: Verify deployment succeeded
        if: always() && steps.freshness.outputs.deploy == 'true'
        shell: bash
        run: |
          if [ "${{ steps.deployment.outcome }}" != "success" ] && [ "${{ steps.deployment_retry.outcome }}" != "success" ]; then
            echo "Both Pages deployment attempts failed."
            exit 1
          fi
